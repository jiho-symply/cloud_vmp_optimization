# Commands using this config are run from the repository root.
workspace_root: .

experiment:
  name: notion_energy_toy_200
  seed: 42
  horizon_hours: 24
  num_scenarios: 10
  target_total_vms: 200
  # Optional exact counts. Leave null to use largest-remainder proportional sampling.
  class_counts: null
  num_servers: 12

data:
  google_dir: data/processed/notion_toy_google2019_v1_pool
  vm_requests: vm_requests.csv
  hourly_usage: vm_usage_hourly_scenarios.csv
  spot_preemption: spot_preemption_scenarios.csv
  batch_families: batch_families.csv
  servers: servers.csv
  scenario_probabilities: scenario_probabilities.csv
  model_params: model_params.json
  nyiso_prices: data/processed/nyiso/electricity_price_nyiso_2019_30min.parquet
  nrel_power: data/processed/nrel/renewable_power_2019_30min_assumed_100mw.parquet

energy_data:
  timezone: America/New_York
  nyiso_zone: NYC
  nrel_site: VA
  scenario_dates:
    - 2019-07-01
    - 2019-07-02
    - 2019-07-03
    - 2019-07-04
    - 2019-07-05
    - 2019-07-06
    - 2019-07-07
    - 2019-07-08
    - 2019-07-09
    - 2019-07-10
  day_ahead_mode: scenario_mean
  electricity_price_floor_usd_per_kwh: 0.01
  sell_price_ratio: 0.85
  renewable_to_reference_demand_ratio: 1.0
  solar_capacity_multiplier: 1.0
  wind_capacity_multiplier: 1.0

ess:
  capacity_ratio_to_full_server_hour: 1.0
  charge_limit_fraction: 0.10
  discharge_limit_fraction: 0.10
  charge_efficiency: 0.95
  discharge_efficiency: 0.895
  initial_soc_fraction: 0.50

economics:
  kappa_on_demand: 10.0
  spot_discount_ratio: 0.30
  kappa_sla: 0.20
  kappa_migration: 0.10

risk:
  alpha: 0.95
  epsilon: 0.05

solver:
  time_limit_seconds: null
  mip_gap: 0.001
  threads: 0
  seed: 42
  numeric_focus: 1
  presolve: 2
  mip_focus: 1
  display_interval_seconds: 1
  soft_mem_limit_gb: 32
  nodefile_start_gb: 4
  nodefile_dir: null
  write_lp: true
  write_mps: true
