  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;chart-description&quot;&gt;
    시나리오가 정해지기 전에 각 서버에 배치한 On-demand VM과 admission된 Spot VM의 configured
    CPU·메모리 크기를 더한 값이다. 100%는 서버 한 대의 물리용량이며 100%를 넘으면
    configured size 기준 overcommit이다. 실제 usage와 Batch allocation은 포함하지 않는다.
    이 incumbent의 최대값이 218%라 막대를 자르지 않도록 그래프는 220%까지 확보하되,

      `${x + halfWidth},${centerY + triangleHeight / 2}`,
    ].join(&quot; &quot;);
    return svgNode(&quot;polygon&quot;, {
      points,
      fill: &quot;var(--foreground)&quot;,
      stroke: &quot;var(--background)&quot;,
      &quot;stroke-width&quot;: 0.65,
      &quot;vector-effect&quot;: &quot;non-scaling-stroke&quot;,
      class: clickable ? &quot;clickable&quot; : &quot;&quot;,

      DATA.scenarios.forEach((scenario, rowIndex) =&gt; {

        if (scenario.id === selectedScenario) {

            x: left - 2,
            y: y - 1,

            height: rowHeight + 2,
            class: &quot;selected-outline&quot;,

          width: Math.max(0.5, cellWidth - 0.4),

        }, svg, [

          count ? `대상 VM: ${eventIds.join(&quot;, &quot;)}` : &quot;&quot;,
        ].filter(Boolean).join(&quot;\n&quot;));

      });
      scenario.events.forEach((count, t) =&gt; {

        const triangle = drawPreemptionTriangle(
          svg,
          x,
          y + rowHeight / 2,
          cellWidth,
          `시나리오 ${scenario.id} · ${timeLabel(t)}\nSpot preemption 시작 ${count}회\n대상 VM: ${eventIds.join(&quot;, &quot;)}`,
          true,
        );
        triangle.addEventListener(&quot;click&quot;, () =&gt; selectScenario(scenario.id));
      });
      if (scenario.id === selectedScenario) {
        svgNode(&quot;rect&quot;, {
          x: left - 2,

    [0, 12, 24, 36, 48].forEach((t) =&gt; {
      const x = left + plotWidth * t / 48;
      svgText(svg, x, height - 8, t === 48 ? &quot;24:00&quot; : timeLabel(t), {
        &quot;text-anchor&quot;: t === 0 ? &quot;start&quot; : t === 48 ? &quot;end&quot; : &quot;middle&quot;,
        class: &quot;secondary-text&quot;,
      });
    });
  }

  function drawConfigured() {
    const width = chartWidth();
    const narrow = width &lt; 620;
    const left = narrow ? 54 : 76;
    const right = 18;
    const plotWidth = width - left - right;
    const cellWidth = plotWidth / 48;
    const laneHeight = 52;
    const laneGap = 16;
    const groupGap = 36;
    const yMax = Math.max(2.2, Math.ceil(DATA.meta.configuredMax * 10) / 10);
    const groupHeight = 2 * laneHeight + laneGap + groupGap;
    const height = 25 + DATA.servers.length * groupHeight + 27;
    const svg = clearSvg(&quot;cei-configured&quot;, width, height);
    addPattern(svg, &quot;cei-config-off&quot;);
    drawTimeGrid(svg, left, 20, plotWidth, height - 48);

    DATA.servers.forEach((server, serverIndex) =&gt; {
      const groupY = 25 + serverIndex * groupHeight;
      const peak = Math.max(
        ...DATA.configured[server].cpu.total,
        ...DATA.configured[server].mem.total,
      );
      svgText(svg, left, groupY - 9, `${server} · 배치된 VM 크기 합계 최대 ${(peak * 100).toFixed(0)}%`, {
        &quot;font-weight&quot;: 600,
      });
      [&quot;cpu&quot;, &quot;mem&quot;].forEach((resource, resourceIndex) =&gt; {
        const y = groupY + resourceIndex * (laneHeight + laneGap);
        svgText(svg, 4, y + laneHeight / 2 + 4, resource.toUpperCase(), {
          class: &quot;secondary-text&quot;,
        });
        const capacityY = y + laneHeight * (1 - 1 / yMax);
        [0, 1, 2].forEach((tick) =&gt; {
          const tickY = y + laneHeight * (1 - tick / yMax);
          svgText(svg, left - 6, tickY + 3.5, `${Math.round(tick * 100)}%`, {
            &quot;text-anchor&quot;: &quot;end&quot;,
            class: &quot;axis-text&quot;,
          });
          if (tick === 2) {
            svgNode(&quot;line&quot;, {
              x1: left,
              x2: left + plotWidth,
              y1: tickY,
              y2: tickY,
              class: &quot;grid-line&quot;,
            }, svg);
          }
        });
        svgNode(&quot;line&quot;, {
          x1: left, x2: left + plotWidth, y1: capacityY, y2: capacityY,
          class: &quot;capacity-line&quot;,
        }, svg);
        DATA.configured[server][resource].total.forEach((value, t) =&gt; {
          if (!DATA.configured[server].on[t]) {
            svgNode(&quot;rect&quot;, {
              x: left + t * cellWidth,
              y,
              width: cellWidth,
              height: laneHeight,
              fill: &quot;url(#cei-config-off)&quot;,
            }, svg);
          }
          const odValue = DATA.configured[server][resource].od[t];
          const spotValue = DATA.configured[server][resource].spot[t];
          const odHeight = laneHeight * Math.min(odValue, yMax) / yMax;
          const spotHeight = laneHeight * Math.min(
            spotValue,
            Math.max(0, yMax - odValue),
          ) / yMax;
          const title = [
            `${server} · ${resource.toUpperCase()} · ${timeLabel(t)}`,
            `On-demand VM configured size 합계: ${(odValue * 100).toFixed(1)}%`,
            `admission된 Spot VM configured size 합계: ${(spotValue * 100).toFixed(1)}%`,
            `배치된 VM configured size 합계: ${(value * 100).toFixed(1)}% (서버 용량 대비)`,
            `서버 상태: ${DATA.configured[server].on[t] ? &quot;ON&quot; : &quot;OFF&quot;}`,
          ].join(&quot;\n&quot;);
          svgNode(&quot;rect&quot;, {
            x: left + t * cellWidth + 0.3,
            y: y + laneHeight - odHeight,
            width: Math.max(0.5, cellWidth - 0.6),
            height: odHeight,
            fill: classColors.od,
            &quot;fill-opacity&quot;: 0.83,
          }, svg, title);
          svgNode(&quot;rect&quot;, {
            x: left + t * cellWidth + 0.3,
            y: y + laneHeight - odHeight - spotHeight,
            width: Math.max(0.5, cellWidth - 0.6),
            height: spotHeight,
            fill: classColors.spot,
            &quot;fill-opacity&quot;: 0.9,
          }, svg, title);
          const totalHeight = laneHeight * Math.min(value, yMax) / yMax;
          svgNode(&quot;rect&quot;, {
            x: left + t * cellWidth + 0.3,
            y: y + laneHeight - totalHeight,
            width: Math.max(0.5, cellWidth - 0.6),
            height: totalHeight,
            fill: &quot;none&quot;,
            stroke: &quot;#334155&quot;,
            &quot;stroke-width&quot;: 0.55,
          }, svg, title);
        });
        svgText(svg, left + plotWidth - 3, capacityY - 4, &quot;서버 용량 100%&quot;, {
          &quot;text-anchor&quot;: &quot;end&quot;,
          class: &quot;axis-text&quot;,
        });
      });
    });
    [0, 12, 24, 36, 48].forEach((t) =&gt; {
      const x = left + plotWidth * t / 48;
      svgText(svg, x, height - 7, t === 48 ? &quot;24:00&quot; : timeLabel(t), {
        &quot;text-anchor&quot;: t === 0 ? &quot;start&quot; : t === 48 ? &quot;end&quot; : &quot;middle&quot;,
        class: &quot;secondary-text&quot;,
      });
    });
  }

  function drawResourceLane(svg, x0, y, plotWidth, laneHeight, server, resource, detail) {
    const cellWidth = plotWidth / 48;
    const components = detail[resource];
    const order = [&quot;od&quot;, &quot;spot&quot;, &quot;batch&quot;];
    const on = detail.on;
    svgNode(&quot;rect&quot;, {
      x: x0,
      y,
      width: plotWidth,
      height: laneHeight,
      fill: &quot;#f8fafc&quot;,
      stroke: &quot;var(--border)&quot;,
      &quot;stroke-width&quot;: 0.6,
    }, svg);
    for (let t = 0; t &lt; 48; t += 1) {
      if (!on[t]) {
        svgNode(&quot;rect&quot;, {
          x: x0 + t * cellWidth,
          y,
          width: cellWidth,
          height: laneHeight,
          fill: &quot;url(#cei-resource-off)&quot;,
        }, svg);
        continue;
      }
      let used = 0;
      const total = order.reduce((sum, key) =&gt; sum + components[key][t], 0);
      order.forEach((key) =&gt; {
        const value = components[key][t];
        if (value &lt;= 0) return;
        const h = Math.min(value, 1 - used) * laneHeight;
        svgNode(&quot;rect&quot;, {
          x: x0 + t * cellWidth + 0.25,
          y: y + laneHeight - used * laneHeight - h,
          width: Math.max(0.5, cellWidth - 0.5),
          height: h,
          fill: classColors[key],
          &quot;fill-opacity&quot;: key === &quot;spot&quot; ? 0.92 : 0.86,
        }, svg, [
          `${server} · ${resource.toUpperCase()} · ${timeLabel(t)}`,
          `${classLabels[key]} served/allocation: ${(value * 100).toFixed(2)}% of server capacity`,
          `실제 물리부하 합계: ${(total * 100).toFixed(2)}% of server capacity`,
        ].join(&quot;\n&quot;));
        used += value;
      });
    }
    svgNode(&quot;line&quot;, {
      x1: x0, x2: x0 + plotWidth, y1: y, y2: y, class: &quot;capacity-line&quot;,
    }, svg);
  }

  function drawDetail() {

        }, svg, [
          `${server} · CPU · ${timeLabel(t)}`,
          `On-demand CPU 초과 부하: ${(value * 100).toFixed(2)}% of server capacity`,
          `막대 높이는 0–${(excessHigh * 100).toFixed(0)}% 축에서 실제 초과율에 비례`,
        ].join(&quot;\n&quot;));
      });

      const cpuY = groupY + 67;
      svgText(svg, 4, cpuY + laneHeight / 2 + 4, &quot;CPU&quot;, {class: &quot;secondary-text&quot;});
      [0, 0.5, 1].forEach((tick) =&gt; {
        const tickY = cpuY + laneHeight * (1 - tick);
        svgText(svg, left - 6, tickY + 3.5, `${Math.round(tick * 100)}%`, {
          &quot;text-anchor&quot;: &quot;end&quot;,
          class: &quot;axis-text&quot;,
        });

      drawResourceLane(svg, left, cpuY, plotWidth, laneHeight, server, &quot;cpu&quot;, serverDetail);

      const memY = groupY + 130;
      svgText(svg, 4, memY + laneHeight / 2 + 4, &quot;MEM&quot;, {
        class: &quot;secondary-text&quot;,
      });
      [0, 0.5, 1].forEach((tick) =&gt; {
        const tickY = memY + laneHeight * (1 - tick);
        svgText(svg, left - 6, tickY + 3.5, `${Math.round(tick * 100)}%`, {
          &quot;text-anchor&quot;: &quot;end&quot;,
          class: &quot;axis-text&quot;,
        });
      });
      drawResourceLane(svg, left, memY, plotWidth, laneHeight, server, &quot;mem&quot;, serverDetail);
    });
    [0, 12, 24, 36, 48].forEach((t) =&gt; {
      const x = left + plotWidth * t / 48;
      svgText(svg, x, height - 7, t === 48 ? &quot;24:00&quot; : timeLabel(t), {
        &quot;text-anchor&quot;: t === 0 ? &quot;start&quot; : t === 48 ? &quot;end&quot; : &quot;middle&quot;,
        class: &quot;secondary-text&quot;,
      });
    });
  }

  function addOperationFrame(svg, left, top, plotWidth, plotHeight, axisY) {
    [0, 12, 24, 36, 48].forEach((t) =&gt; {
      const x = left + plotWidth * t / 48;
      svgNode(&quot;line&quot;, {
        x1: x,
        x2: x,
        y1: top,
        y2: top + plotHeight,
        class: &quot;grid-line&quot;,
      }, svg);
      svgText(svg, x, axisY, t === 48 ? &quot;24:00&quot; : timeLabel(t), {
        &quot;text-anchor&quot;: t === 0 ? &quot;start&quot; : t === 48 ? &quot;end&quot; : &quot;middle&quot;,
        class: &quot;secondary-text&quot;,
      });
    });
  }

  function addOperationSummary(svg, titleText, descriptionText) {
    const title = svgNode(&quot;title&quot;, {}, svg);
    title.textContent = titleText;
    const description = svgNode(&quot;desc&quot;, {}, svg);
    description.textContent = descriptionText;
    svg.setAttribute(&quot;aria-label&quot;, descriptionText);
  }

  function drawOdOperations(detail, width) {
    const left = 45;
    const right = 14;
    const plotWidth = width - left - right;
    const cellWidth = plotWidth / 48;
    const rowHeight = 13;
    const top = 4;
    const plotHeight = detail.od.length * rowHeight;
    const axisY = top + plotHeight + 20;
    const svg = clearSvg(&quot;cei-operations-od&quot;, width, axisY + 8);
    addOperationSummary(
      svg,
      &quot;On-demand placement&quot;,
      &quot;On-demand VM placement by fixed server over 24 hours. Row labels are OD identifiers.&quot;,
    );
    addOperationFrame(svg, left, top, plotWidth, plotHeight, axisY);
    detail.od.forEach((vm, rowIndex) =&gt; {
      const y = top + rowIndex * rowHeight;
      svgText(svg, left - 7, y + 9.3, vm.id, {
        &quot;text-anchor&quot;: &quot;end&quot;,
        class: &quot;secondary-text&quot;,
      });
      vm.state.forEach((state, t) =&gt; {
        if (state &lt; 0) return;
        svgNode(&quot;rect&quot;, {
          x: left + t * cellWidth,
          y,
          width: Math.max(0.5, cellWidth - 0.25),
          height: rowHeight - 0.4,
          fill: serverColors[state],
          &quot;fill-opacity&quot;: 0.9,
        }, svg, [
          `${vm.id} (${vm.fullId}) · ${timeLabel(t)}–${timeLabel(t + 1)}`,
          `Placement: ${DATA.servers[state]}`,
          `Scenario ${selectedRasterScenario} CPU / memory demand: ${vm.cpu[t].toFixed(4)} / ${vm.mem[t].toFixed(4)}`,
          `Configured CPU / memory size: ${vm.qCpu} / ${vm.qMem}`,
        ].join(&quot;\n&quot;));
      });
    });
  }

  function drawSpotOperations(detail, width) {
    const left = 45;
    const right = 14;
    const plotWidth = width - left - right;
    const cellWidth = plotWidth / 48;
    const rowHeight = 20;
    const top = 4;
    const plotHeight = detail.spot.length * rowHeight;
    const axisY = top + plotHeight + 20;
    const admittedCount = detail.spot.filter((vm) =&gt; vm.accepted).length;
    const rejectedCount = detail.spot.length - admittedCount;
    const svg = clearSvg(&quot;cei-operations-spot&quot;, width, axisY + 8);
    addOperationSummary(
      svg,
      &quot;Spot service and preemption&quot;,
      `Scenario ${selectedRasterScenario}. ${detail.spot.length} Spot candidates: ` +
        `${admittedCount} admitted and ${rejectedCount} rejected.`,
    );
    addRejectedPattern(svg, &quot;cei-spot-rejected&quot;);
    addOperationFrame(svg, left, top, plotWidth, plotHeight, axisY);
    detail.spot.forEach((vm, rowIndex) =&gt; {
      const y = top + rowIndex * rowHeight;
      const decision = vm.accepted ? &quot;Admitted&quot; : &quot;Rejected&quot;;
      const lifecycle =
        `${timeLabel(vm.arrivalT)}–${timeLabel(vm.departureT + 1)} · ${vm.lifespanHours.toFixed(1)} h`;
      svgText(svg, left - 7, y + rowHeight / 2 + 4, vm.id, {
        &quot;text-anchor&quot;: &quot;end&quot;,
        class: &quot;secondary-text&quot;,
      });
      vm.state.forEach((state, t) =&gt; {
        if (state === -1) return;
        const rejected = state === -3;
        const preempted = state === -2;
        const fill = rejected
          ? &quot;url(#cei-spot-rejected)&quot;
          : preempted
            ? &quot;var(--muted)&quot;
            : serverColors[state];
        const slotState = rejected
          ? &quot;Rejected; not served&quot;
          : preempted
            ? &quot;Preempted&quot;
            : `Running on ${DATA.servers[state]}`;
        const demandLabel = rejected ? &quot;Input demand if admitted&quot; : &quot;Demand&quot;;
        const title = [
          `${vm.id} (${vm.fullId}) · ${timeLabel(t)}–${timeLabel(t + 1)}`,
          `Admission: ${decision}`,
          `Host: ${vm.server || &quot;없음&quot;}`,
          `Lifecycle: ${lifecycle} · slots t${vm.arrivalT}–t${vm.departureT}`,
          `Scenario ${selectedRasterScenario}: ${slotState}`,
          `${demandLabel} CPU / memory: ${vm.cpu[t].toFixed(4)} / ${vm.mem[t].toFixed(4)}`,
          `Configured CPU / memory size: ${vm.qCpu} / ${vm.qMem}`,
          vm.events[t] ? &quot;Preemption starts in this slot&quot; : &quot;&quot;,
        ].filter(Boolean).join(&quot;\n&quot;);
        svgNode(&quot;rect&quot;, {
          x: left + t * cellWidth,
          y: y + 2,
          width: Math.max(0.5, cellWidth - 0.25),
          height: rowHeight - 4,
          fill,
          &quot;fill-opacity&quot;: preempted ? 0.88 : 0.92,
          stroke: rejected ? &quot;var(--viz-series-2)&quot; : &quot;none&quot;,
          &quot;stroke-width&quot;: rejected ? 0.8 : 0,
        }, svg, title);
        if (vm.events[t]) {
          drawPreemptionTriangle(
            svg,
            left + (t + 0.5) * cellWidth,
            y + rowHeight / 2,
            cellWidth,
            `${vm.id} (${vm.fullId}) · ${timeLabel(t)}\nScenario ${selectedRasterScenario}: preemption 시작`,
          );
        }
      });
    });
  }

  function shortBatchId(family) {
    return family.replace(&quot;batch&quot;, &quot;B&quot;);
  }

  function drawBatchOperations(detail, width) {
    const narrow = width &lt; 620;
    const left = 45;
    const right = narrow ? 14 : 50;
    const plotWidth = width - left - right;
    const cellWidth = plotWidth / 48;
    const laneHeight = 28;
    const laneGap = 2;
    const familyGap = 14;
    const top = 4;
    const groups = [];
    detail.batch.forEach((row) =&gt; {
      const previous = groups[groups.length - 1];
      if (!previous || previous.family !== row.family) {
        groups.push({family: row.family, rows: [row]});
      } else {
        previous.rows.push(row);
      }
    });
    let cursor = top;
    groups.forEach((group, groupIndex) =&gt; {
      const groupTop = cursor;
      group.rows.forEach((row, rowIndex) =&gt; {
        row.renderY = cursor;
        cursor += laneHeight;
        if (rowIndex &lt; group.rows.length - 1) cursor += laneGap;
      });
      group.centerY = (groupTop + cursor) / 2;
      if (groupIndex &lt; groups.length - 1) cursor += familyGap;
    });
    const plotHeight = cursor - top;
    const axisY = top + plotHeight + 20;
    const svg = clearSvg(&quot;cei-operations-batch&quot;, width, axisY + 8);
    addOperationSummary(
      svg,
      &quot;Batch preparation and work&quot;,
      `Scenario ${selectedRasterScenario}. Three Batch families in four family-server lanes. ` +
        &quot;Outlined cells are prepared; bar height is actual work relative to the family slot maximum.&quot;,
    );
    addOperationFrame(svg, left, top, plotWidth, plotHeight, axisY);
    groups.forEach((group) =&gt; {
      const first = group.rows[0];
      const familyLabel = shortBatchId(group.family);
      svgText(svg, left - 7, group.centerY + 4, familyLabel, {
        &quot;text-anchor&quot;: &quot;end&quot;,
        class: &quot;secondary-text&quot;,
      });
      group.rows.forEach((row) =&gt; {
        const y = row.renderY;
        row.prepared.forEach((prepared, t) =&gt; {
          if (!prepared) return;
          const title = [
            `${familyLabel} · ${row.server} · ${timeLabel(t)}–${timeLabel(t + 1)}`,
            `Family: ${row.jobs} source jobs · total required work ${row.totalWork.toFixed(4)}`,
            &quot;Preparation: prepared&quot;,
            `Scenario ${selectedRasterScenario} actual work: ${row.work[t].toFixed(4)}`,
            `Per-slot maximum: ${row.slotMaxWork.toFixed(4)}`,
            `Maximum 대비: ${(row.intensity[t] * 100).toFixed(1)}%`,
            `Configured CPU / memory size: ${row.qCpu} / ${row.qMem}`,
            row.start[t] ? &quot;Preparation starts here&quot; : &quot;&quot;,
          ].filter(Boolean).join(&quot;\n&quot;);
          svgNode(&quot;rect&quot;, {
            x: left + t * cellWidth + 0.4,
            y: y + 0.5,
            width: Math.max(0.5, cellWidth - 0.8),
            height: laneHeight - 1,
            fill: &quot;var(--viz-series-3)&quot;,
            &quot;fill-opacity&quot;: 0.08,
            stroke: &quot;var(--viz-series-3)&quot;,
            &quot;stroke-width&quot;: 0.7,
          }, svg, title);
          const workHeight = (laneHeight - 4) * row.intensity[t];
          if (workHeight &gt; 0) {
            svgNode(&quot;rect&quot;, {
              x: left + t * cellWidth + 1.2,
              y: y + laneHeight - 2 - workHeight,
              width: Math.max(0.5, cellWidth - 2.4),
              height: workHeight,
              fill: &quot;var(--viz-series-3)&quot;,
              &quot;fill-opacity&quot;: 0.9,
            }, svg, title);
          }
          if (row.start[t]) {
            svgNode(&quot;line&quot;, {
              x1: left + t * cellWidth + 1,
              x2: left + t * cellWidth + 1,
              y1: y + 1.5,
              y2: y + laneHeight - 1.5,
              stroke: &quot;var(--foreground)&quot;,
              &quot;stroke-width&quot;: 1.6,
              &quot;vector-effect&quot;: &quot;non-scaling-stroke&quot;,
            }, svg, `${familyLabel} · ${row.server} · ${timeLabel(t)}\nPreparation starts here`);
          }
        });
      });
    });
    if (!narrow &amp;&amp; groups.length) {
      const rulerY = groups[0].rows[0].renderY;
      const rulerX = left + plotWidth + 8;
      svgNode(&quot;line&quot;, {
        x1: rulerX,
        x2: rulerX,
        y1: rulerY + 1,
        y2: rulerY + laneHeight - 1,
        stroke: &quot;var(--muted-foreground)&quot;,
        &quot;stroke-width&quot;: 0.8,
      }, svg);
      svgText(svg, rulerX + 4, rulerY + 7, &quot;100%&quot;, {class: &quot;axis-text&quot;});
      svgText(svg, rulerX + 4, rulerY + laneHeight, &quot;0%&quot;, {class: &quot;axis-text&quot;});
    }
  }

  function drawOperations(detail) {
    const width = chartWidth();
    const scenario = DATA.scenarios.find(
      (row) =&gt; row.id === selectedRasterScenario
    );
    const batchWork = detail.batch.reduce(
      (sum, row) =&gt; sum + row.work.reduce((rowSum, value) =&gt; rowSum + value, 0),
      0,
    );
    document.getElementById(&quot;cei-raster-summary&quot;).textContent =
      `Spot preemption ${scenario.preemptionEvents} · Batch work ${batchWork.toFixed(2)}`;
    drawOdOperations(detail, width);
    drawSpotOperations(detail, width);
    drawBatchOperations(detail, width);
  }

  document.getElementById(&quot;cei-provenance&quot;).textContent =
    `Full On-demand + Spot + Batch incumbent · ${DATA.meta.status} · solver gap ${(DATA.meta.gap * 100).toFixed(2)}% · ` +
    `runtime ${(DATA.meta.runtime / 3600).toFixed(2)}h · total profit $${DATA.meta.totalProfit.toFixed(3)} · ` +
    `empirical CVaR max ${DATA.meta.empiricalCvarMax.toFixed(4)} / ε=${DATA.meta.epsilon} · ` +
    `α=${DATA.meta.alpha} · Spot accepted ${DATA.meta.acceptedSpotCount}/${DATA.meta.spotCandidateCount} · migration ${DATA.meta.migration} · ` +
    `resource-ledger residual ≤ ${Math.max(DATA.meta.cpuResidual, DATA.meta.memResidual).toExponential(1)}`;

  const settingsRows = [
    [
      &quot;데이터셋&quot;,
      `${DATA.meta.dataset} · ${DATA.meta.selectionPolicy}`,
    ],
    [
      &quot;문제 규모&quot;,
      `On-demand ${DATA.meta.classCounts.onDemand} · Spot 후보 ${DATA.meta.classCounts.spot} · ` +
      `Batch job ${DATA.meta.classCounts.batchJobs} → ${DATA.meta.classCounts.batchFamilies} families · ` +
      `후보 서버 ${DATA.meta.numServers}대`,
    ],
    [
      &quot;시간·시나리오&quot;,
      `${DATA.meta.horizonHours}시간 · ${DATA.meta.periods.length}개 × ${DATA.meta.slotMinutes}분 · ` +
      `${DATA.meta.numScenarios}개 시나리오(각 10%) · scenario 0 관측값, 나머지 synthetic`,
    ],
    [
      &quot;수요 샘플링&quot;,
      `mean-preserving lognormal · CPU sigma ${DATA.meta.cpuSigma} · memory sigma ${DATA.meta.memorySigma} · ` +
      `${DATA.meta.syntheticRngMode} · seed ${DATA.meta.seed} · configured size를 넘지 않도록 cap`,
    ],
    [
      &quot;2nd-stage 정책&quot;,
      `On-demand migration ${DATA.meta.migrationFixedZero ? &quot;금지&quot; : &quot;허용&quot;} · ` +
      `Spot preemption ${DATA.meta.spotPreemptionAllowed ? &quot;허용&quot; : &quot;금지&quot;} · ` +
      `On-demand CPU 초과 부하 recourse ${DATA.meta.odCpuExcessAllowed ? &quot;허용&quot; : &quot;금지&quot;} · Batch allocation 허용`,
    ],
    [
      &quot;CPU 위험 제한&quot;,
      `CVaR tail level ${DATA.meta.alpha} · 각 서버·시간의 tail 평균 CPU 초과 부하를 ` +
      `서버 CPU 용량의 ${(DATA.meta.epsilon * 100).toFixed(0)}% 이하로 제한`,
    ],
    [
      &quot;서버·전력&quot;,
      `CPU ${DATA.meta.serverCpuCapacity}, memory ${DATA.meta.serverMemoryCapacity} · 최소 ON/OFF 각 ${DATA.meta.minimumOnSlots} slots · ` +
      `idle ${DATA.meta.idleEnergyPerSlot} kWh/slot + served CPU 단위당 ${DATA.meta.cpuEnergyPerUnitSlot} kWh/slot`,
    ],
    [
      &quot;경제·가격&quot;,
      `On-demand revenue multiplier ${DATA.meta.kappaOnDemand} · Spot/On-demand 가격 비율 ${(DATA.meta.spotDiscountRatio * 100).toFixed(0)}% · ` +
      `Batch/On-demand 가격 비율 ${(DATA.meta.batchDiscountRatio * 100).toFixed(0)}% · NYISO ${DATA.meta.electricitySite} · ` +
      `price floor $${DATA.meta.electricityFloor.toFixed(2)}/kWh`,
    ],
    [
      &quot;Solver&quot;,
      `${DATA.meta.solverThreads} threads · time limit ${(DATA.meta.timeLimitSeconds / 3600).toFixed(0)}h · ` +
      `target gap ${(DATA.meta.mipGapTarget * 100).toFixed(1)}% · NoRel ${DATA.meta.noRelSeconds}s · ` +
      `seed ${DATA.meta.seed} · NumericFocus ${DATA.meta.numericFocus} · Presolve ${DATA.meta.presolve}`,
    ],
  ];
  const settingsBody = document.getElementById(&quot;cei-settings&quot;);
  settingsRows.forEach(([label, value]) =&gt; {
    const row = document.createElement(&quot;tr&quot;);
    const heading = document.createElement(&quot;th&quot;);
    heading.scope = &quot;row&quot;;
    heading.textContent = label;
    const cell = document.createElement(&quot;td&quot;);
    cell.textContent = value;
    row.append(heading, cell);
    settingsBody.appendChild(row);
  });

  const pressureScaleLow = Math.max(
    0,
    Math.floor(Math.min(DATA.meta.postCpuMin, DATA.meta.postMemMin) * 20) / 20,
  );
  const cpuPressureScaleHigh = Math.ceil(DATA.meta.postCpuMax * 10) / 10;
  const memPressureScaleHigh = Math.ceil(DATA.meta.postMemMax * 20) / 20;
  document.getElementById(&quot;cei-pressure-scale-note&quot;).textContent =
    ` 색상 범위는 편차가 드러나도록 CPU ${(pressureScaleLow * 100).toFixed(0)}–${(cpuPressureScaleHigh * 100).toFixed(0)}%, ` +
    `메모리 ${(pressureScaleLow * 100).toFixed(0)}–${(memPressureScaleHigh * 100).toFixed(0)}%로 조정했다.`;

  const selector = document.getElementById(&quot;cei-scenario&quot;);
  const rasterSelector = document.getElementById(&quot;cei-raster-scenario&quot;);
  DATA.scenarios.forEach((scenario) =&gt; {
    const option = document.createElement(&quot;option&quot;);
    option.value = String(scenario.id);
    option.textContent = `Scenario ${scenario.id}`;
    selector.appendChild(option);
    const rasterOption = document.createElement(&quot;option&quot;);
    rasterOption.value = String(scenario.id);
    rasterOption.textContent = `Scenario ${scenario.id}`;
    rasterSelector.appendChild(rasterOption);
  });
  selector.value = String(selectedScenario);
  rasterSelector.value = String(selectedRasterScenario);
  selector.addEventListener(&quot;change&quot;, (event) =&gt; selectScenario(event.target.value));
  rasterSelector.addEventListener(
    &quot;change&quot;,
    (event) =&gt; selectRasterScenario(event.target.value),
  );

  drawAtlas();
  drawConfigured();
  drawDetail();
  drawOperations(DATA.detail[String(selectedRasterScenario)]);

  let resizeTimer = null;
  const observer = new ResizeObserver(() =&gt; {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() =&gt; {
      drawAtlas();
      drawConfigured();
      drawDetail();
      drawOperations(DATA.detail[String(selectedRasterScenario)]);
    }, 80);
  });
  observer.observe(root);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
