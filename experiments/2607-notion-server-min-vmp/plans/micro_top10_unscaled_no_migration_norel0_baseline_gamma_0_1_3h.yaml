schema_version: 1
status: planned
suite_name: notion_server_min_micro_top10_unscaled_no_migration_norel0_baseline_gamma_0_1_3h
base_config: configs/micro_top10_unscaled_no_migration_norel0_baseline.yaml
output_root: runs/notion_server_min_micro_top10_unscaled_no_migration_norel0_baseline_gamma_0_1_3h

generation:
  design: one_factor_at_a_time
  semantics: migration_prohibited_baseline_anchor_plus_one_spot_discount_override
  forbid_full_cartesian_product: true
  combine_factors_within_stage: false
  deduplicate_identical_configs_globally: true
  exact_unique_candidate_configs:
    first_stage: 2
  immutable_configs: true
  require_common_random_numbers_within_comparison_group: true

stages:
  first_stage:
    enabled: true
    purpose: compare_no_migration_norel0_gamma_0_3_against_gamma_0_1
    design: one_factor_at_a_time
    anchor: baseline
    factors:
      - id: spot_discount_ratio
        config_path: economics.spot_discount_ratio
        levels:
          - {id: gamma_0_1, value: 0.1}

execution_policy:
  max_parallel_jobs: 2
  threads_per_job: 16
  total_thread_limit: 32
  time_limit_seconds: 10800
  mip_gap: 0.001
  soft_mem_limit_gb_per_job: 80
  nodefile_start_gb: 0.5
  safety:
    memory_reserve_gb: 64
    disk_reserve_gb: 60
    write_lp: false
    write_mps: false

validation:
  formulation_entrypoint: run_experiment_no_migration.py
  decisions:
    migration_allowed: false
    excess_indicator_allowed: true
    spot_preemption_allowed: true
  solver:
    no_rel_heur_time_seconds: 0
    time_limit_seconds: 10800
    threads_per_job: 16
  common_parameters:
    scenarios: 10
    on_demand: 10
    spot: 10
    batch_jobs: 10
    max_batch_families: 3
    candidate_servers: 6
    cpu_lognormal_sigma: 0.24
    memory_lognormal_sigma: 0.12
    migration_coefficient: 0.05
