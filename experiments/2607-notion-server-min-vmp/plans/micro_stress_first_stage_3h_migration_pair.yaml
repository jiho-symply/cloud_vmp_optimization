  deduplicate_across_variants: false
  exact_unique_candidate_configs_per_variant: 11
  exact_solver_launches: 22
  note: >-
    The migration-coefficient cases in migration_prohibited are intentionally
    retained as matched controls even though fixing every migration variable to
    zero makes those coefficient levels mathematically equivalent.

