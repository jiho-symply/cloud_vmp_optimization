# Resolved relative to this config file, so clones do not depend on one user's path.
workspace_root: ../../..

experiment:
  name: notion_server_min_baseline
  seed: 42
  horizon_hours: 24
  slot_minutes: 30
  num_scenarios: 20
  class_counts:
    on_demand: 50
    spot: 50
    batch_jobs: 50
  num_servers: 6

data:
  # Episode-keyed preprocessing with distribution-p100 CPU maxima and strict
  # assigned-machine history/capacity quality gates.
  google_dir: data/processed/notion_toy_google2019_v5_mode_capacity_bounded
  vm_requests: vm_requests.csv
  # Only scenario 0 is read, in chunks, before the 20 workload scenarios are built.
  usage_5min_scenarios: vm_usage_5min_scenarios.csv
  usage_sorted_by_scenario: true
  csv_chunksize: 400000
  servers: servers.csv
  nyiso_prices: data/processed/nyiso/electricity_price_nyiso_2019_30min.parquet
  additional_source_files:
    - data/raw/google2019_cell_a_day0_cpu_distribution/usage_5min.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/instance_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/collection_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/machine_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/metadata.json
    - data/raw/nyiso/rt_lbmp_zonal_5min/2019/20190601realtime_zone_csv.zip
    - data/raw/nyiso/rt_lbmp_zonal_5min/2019/20190701realtime_zone_csv.zip

workload_scenarios:
  # Scenario 0 is observed. Scenarios 1..19 use mean-preserving lognormal
  # multipliers and every synthetic CPU/MEM value is clipped to [0, q]. The
  # extracted CPU distribution p100 defines configured CPU maxima; percentile
  # rows are not used as time-aligned scenario samples.
  cpu_lognormal_sigma: 0.22
  memory_lognormal_sigma: 0.08

batch:
  # The 50 selected jobs are grouped into at most 10 deterministic configured-pair
  # rank bins; identical configured pairs remain together.
  max_families: 10
  configured_pair_round_digits: 12
  base_cpu: 0.0
  base_mem: 0.05
  startup_cpu: 0.05
  startup_mem: 0.0

server:
  # The inherited toy coefficients are hourly energy quantities. The loader
  # multiplies them by 30/60 for this experiment's 30-minute slots.
  source_energy_interval_minutes: 60
  min_on_slots: 2
  min_off_slots: 2

electricity_price:
  timezone: America/New_York
  site_id: NYC
  scenario_start_date: 2019-06-01
  multiplier: 1.0
  floor_usd_per_kwh: 0.01
  # The canonical processed table interpolated these two absent raw 5-minute
  # NYC observations before forming the six-row 30-minute averages.
  known_interpolated_raw_slots:
    - 2019-06-27T11:20:00-04:00
    - 2019-06-27T11:30:00-04:00

economics:
  kappa_on_demand: 10.0
  spot_discount_ratio: 0.3
  batch_discount_ratio: 0.5

migration:
  # Migration energy per unit normalized OD memory usage.
  coefficient: 0.05

risk:
  alpha: 0.95
  epsilon: 0.05

solver:
  mip_gap: 0.001
  threads: 8
  time_limit_seconds: null
  seed: 42
  numeric_focus: 1
  presolve: 2
  # Avoid emitting large model files for each sweep run.
  write_lp: false
  write_mps: false
