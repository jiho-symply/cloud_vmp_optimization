# Resolved relative to this config file. The dedicated launcher replaces
# data.google_dir with the absolute --google-dir supplied at launch time.
workspace_root: ../../..

experiment:
  name: notion_server_min_micro_stress_fixed_zero_migration_excess_preemption_baseline
  seed: 42
  horizon_hours: 24
  slot_minutes: 30
  num_scenarios: 10
  class_counts:
    on_demand: 10
    spot: 10
    batch_jobs: 10
  # Six candidates leave one unit of headroom around the intended five-server
  # capacity-pressure regime. The builder/validation step remains authoritative
  # for the actual lower bound and feasibility.
  num_servers: 6

data:
  # Never run this config directly. The cumulative fixed-zero sweep launcher
  # requires --google-dir and replaces this sentinel in every derived config.
  google_dir: __REQUIRED_VIA_MICRO_STRESS_LAUNCHER_GOOGLE_DIR__
  vm_requests: vm_requests.csv
  usage_5min_scenarios: vm_usage_5min_scenarios.csv
  usage_sorted_by_scenario: true
  csv_chunksize: 400000
  servers: servers.csv
  nyiso_prices: data/processed/nyiso/electricity_price_nyiso_2019_30min.parquet
  additional_source_files:
    - data/raw/google2019_cell_a_day0_cpu_distribution/usage_5min.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/instance_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/collection_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/machine_events.parquet
    - data/raw/google2019_cell_a_day0_cpu_distribution/metadata.json
    - data/raw/nyiso/rt_lbmp_zonal_5min/2019/20190601realtime_zone_csv.zip
    - data/raw/nyiso/rt_lbmp_zonal_5min/2019/20190701realtime_zone_csv.zip

workload_scenarios:
  cpu_lognormal_sigma: 0.22
  memory_lognormal_sigma: 0.08

batch:
  # The ten selected jobs are grouped into at most three deterministic
  # configured-pair rank bins; identical configured pairs remain together.
  max_families: 3
  configured_pair_round_digits: 12
  base_cpu: 0.0
  base_mem: 0.05
  startup_cpu: 0.05
  startup_mem: 0.0

server:
  source_energy_interval_minutes: 60
  min_on_slots: 2
  min_off_slots: 2

electricity_price:
  timezone: America/New_York
  site_id: NYC
  scenario_start_date: 2019-06-01
  multiplier: 1.0
  floor_usd_per_kwh: 0.01
  known_interpolated_raw_slots:
    - 2019-06-27T11:20:00-04:00
    - 2019-06-27T11:30:00-04:00

economics:
  kappa_on_demand: 10.0
  spot_discount_ratio: 0.3
  batch_discount_ratio: 0.5

migration:
  coefficient: 0.05
  fixed_zero: true

excess_load_indicator:
  fixed_zero: true

spot_preemption:
  fixed_zero: true

risk:
  alpha: 0.95
  epsilon: 0.05

solver:
  mip_gap: 0.001
  threads: 16
  time_limit_seconds: 10800
  seed: 42
  numeric_focus: 1
  presolve: 2
  soft_mem_limit_gb: 64
  nodefile_start_gb: 0.5
  nodefile_dir: nodefiles
  write_lp: false
  write_mps: false
